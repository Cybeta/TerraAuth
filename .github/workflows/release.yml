name: Release Build

# 推送 v* 标签（如 v0.1.0）时自动编译并发布 GitHub Release：
#   git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            asset: TerraAuth-win-x64.zip
          - os: ubuntu-latest
            rid: linux-x64
            asset: TerraAuth-linux-x64.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish (self-contained)
        run: dotnet publish terraauth/TerraAuth.csproj -c Release -r ${{ matrix.rid }} --self-contained true -o publish

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path publish/* -DestinationPath ${{ matrix.asset }}

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: (cd publish && zip -r ../${{ matrix.asset }} .)

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset }}
          body_path: RELEASE_NOTES.md
